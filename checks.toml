# What check.cmd plays in Civilization V once it has built the mod. Every run also fails if a plugin stops working or
# Lua.log has a Lua error. bazaar_check\README.md lists every step a checks file can take.
mods = ["Build/Small Bugfix Compendium (Bazaar 0.5)"]

[[steps]]
plugin = "SmallBugfixCompendium.dll"
status = "Loaded"

[[steps]]
start_game = "duel"

[[steps]]
end_turns = 1

[[steps]]
lua = "(function() local team, seen = Game.GetActiveTeam(), {0, 0, 0} for i = 0, Map.GetNumPlots() - 1 do local plot = Map.GetPlotByIndex(i) local want = plot:IsRevealed(team, false) and (plot:IsVisible(team, false) and 2 or 1) or 0 if plot:GetActiveFogOfWarMode() ~= want then return false end seen[want + 1] = seen[want + 1] + 1 end return seen[1] > 0 and seen[2] > 0 and seen[3] > 0 end)()"
what = "every tile reports as unexplored, seen before or visible, as the game knows it, and each kind turns up"

[[steps]]
save = "compendium"

[[steps]]
load = "compendium"

[[steps]]
end_turns = 1

[[steps]]
lua = "(function() local team = Game.GetActiveTeam() for i = 0, Map.GetNumPlots() - 1 do local plot = Map.GetPlotByIndex(i) local want = plot:IsRevealed(team, false) and (plot:IsVisible(team, false) and 2 or 1) or 0 if plot:GetActiveFogOfWarMode() ~= want then return false end end return true end)()"
what = "after a save is loaded, every tile still reports its fog of war as the game knows it"

[[steps]]
log = "Bazaar.log"
lacks = 'could not register'
what = "every hook registered"
